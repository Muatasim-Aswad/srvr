name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.3
      - name: Scan push or pull request range
        run: python3 scripts/release.py scan-range --before "$BEFORE" --after "$AFTER"
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}

  verify:
    name: Verify Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.16", "3.13.16", "3.14.7"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.3
      - name: Verify
        run: scripts/verify
        env:
          SRVR_VERIFY_PYTHON: ${{ matrix.python }}

  docker:
    name: Docker workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.3
      - name: Test real deployments
        run: scripts/verify --docker-only

  package:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.3
      - name: Build and test package
        run: scripts/verify --package-only
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debian-package
          path: dist/
          if-no-files-found: error

  gates:
    name: Required checks
    if: ${{ always() }}
    needs: [verify, docker, package, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        run: |
          test "$VERIFY" = success
          test "$DOCKER" = success
          test "$PACKAGE" = success
          test "$SECRETS" = success
        env:
          VERIFY: ${{ needs.verify.result }}
          DOCKER: ${{ needs.docker.result }}
          PACKAGE: ${{ needs.package.result }}
          SECRETS: ${{ needs.secrets.result }}
