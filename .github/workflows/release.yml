name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.3
      - name: Build the tagged source and run every gate
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          python3 scripts/release.py prepare --ref "$TAG" --output dist/release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/release/
          if-no-files-found: error

  publish:
    name: Publish verified artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist/release
      - name: Verify and smoke-test downloaded artifacts
        run: |
          python3 scripts/release.py verify-bundle --output dist/release
          docker build -t srvr-package-builder:trixie packaging
          scripts/test-deb "dist/release/srvr_$(python3 -c 'import srvr; print(srvr.__version__)')-1_all.deb"
      - name: Publish the complete draft
        run: |
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["isDraft"])' "$RUNNER_TEMP/release.json")" = False; then
              gh release download "$TAG" --dir "$RUNNER_TEMP/published"
              python3 scripts/release.py verify-bundle --output "$RUNNER_TEMP/published"
              for artifact in dist/release/*; do cmp "$artifact" "$RUNNER_TEMP/published/$(basename "$artifact")"; done
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file dist/release/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/release/* --clobber
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
