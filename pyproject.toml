[project]
name = "srvr"
version = "0.2.0"
description = "Manage the Docker Compose services on a single Docker host"
requires-python = ">=3.11"
license = "MIT"
dependencies = []  # standard library only: the server has no pip environment

[project.urls]
Homepage = "https://github.com/Muatasim-Aswad/srvr"
Source = "https://github.com/Muatasim-Aswad/srvr"
Issues = "https://github.com/Muatasim-Aswad/srvr/issues"

[dependency-groups]
dev = ["ruff==0.17.3", "mypy==2.4.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR0911",  # state classifiers read best as early returns
    "PLR0913",  # keyword-heavy helpers are clearer than option objects here
    "PLR2004",  # small literal thresholds read fine inline
    "PLC0415",  # lazy imports are deliberate in tests
    "RUF001",   # arrows and check marks in output are intentional
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
